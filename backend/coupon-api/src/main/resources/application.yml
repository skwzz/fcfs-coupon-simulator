# 개발 모드 기본값. 실측 모드(Docker)에서는 환경변수로 호스트를 바꾼다.
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 수천 명이 동시에 새 연결을 맺으면 기본 대기 큐(100)가 넘쳐서 연결 거부가 난다.
    # 실무에서는 앞단 로드밸런서가 이 버스트를 받아 주므로, 개발 모드에서는 큐를 넉넉히 둔다.
    accept-count: ${ACCEPT_COUNT:2000}

spring:
  application:
    name: coupon-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/coupon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: coupon
    password: coupon
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만들고, JPA는 엔티티와 맞는지만 확인한다
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

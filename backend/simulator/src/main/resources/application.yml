server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: simulator
  threads:
    virtual:
      enabled: true

simulator:
  # 가상 사용자가 요청을 보낼 곳. 개발 모드는 coupon-api 직접, 실측 모드는 nginx
  target-base-url: ${TARGET_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 실측 모드의 L7 로드밸런서. coupon-api 두 대에 round robin으로 나눈다.
# auto로 두면 컨테이너 CPU 제한(0.5)이 아니라 호스트 코어 수만큼 워커를 띄운다.
# 그러면 워커마다 메모리를 잡아서 재시도 폭주 때 메모리 한도를 넘고 워커가 OOM으로 죽는다 (docs/06 Phase 4 결과)
worker_processes 1;
# 가상 사용자 수천 명이 동시에 연결하므로 파일 디스크립터와 연결 수를 넉넉히 둔다
worker_rlimit_nofile 65535;

events {
    # 요청 하나에 연결 2개(클라이언트 쪽, API 쪽)를 쓰므로 동시 요청 약 8천 개까지.
    # 넘치는 연결은 바로 끊는다. 무제한으로 받으면 연결마다 잡는 버퍼 때문에 메모리 한도를 넘어 nginx 자체가 죽는다
    worker_connections 16384;
}

http {
    access_log off;

    upstream coupon_api {
        server coupon-api-1:8080;
        server coupon-api-2:8080;
        # nginx → API 구간은 연결을 재사용한다 (요청마다 TCP 연결을 새로 맺지 않음)
        keepalive 128;
    }

    server {
        # 동시에 몰리는 새 연결을 받아 둘 대기 큐
        listen 80 backlog=8192;

        location / {
            proxy_pass http://coupon_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            # 한 인스턴스가 실패해도 다른 인스턴스로 재시도하지 않는다.
            # 발급 요청은 멱등이 아니라서 재시도하면 같은 요청이 두 번 처리될 수 있다.
            proxy_next_upstream off;
        }
    }
}

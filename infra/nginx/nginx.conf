# 실측 모드의 L7 로드밸런서. coupon-api 두 대에 round robin으로 나눈다.
# auto로 두면 컨테이너 CPU 제한(0.5)이 아니라 호스트 코어 수만큼 워커를 띄운다.
# 그러면 워커마다 메모리를 잡아서 재시도 폭주 때 메모리 한도를 넘고 워커가 OOM으로 죽는다 (docs/06 Phase 4 결과)
worker_processes 1;
# 가상 사용자 수천 명이 동시에 연결하므로 파일 디스크립터와 연결 수를 넉넉히 둔다
worker_rlimit_nofile 65535;

events {
    # 요청 하나에 연결 2개(클라이언트 쪽, API 쪽)를 쓰므로 동시 요청 약 1만 6천 개까지.
    # 대기열 SSE는 기다리는 내내 연결을 잡고 있어서 1만 명이 기다리면 그것만으로 2만 개를 쓴다.
    # 넘치는 연결은 바로 끊는다. 무제한으로 받으면 연결마다 잡는 버퍼 때문에 메모리 한도를 넘어 nginx 자체가 죽는다
    worker_connections 32768;
}

http {
    access_log off;

    upstream coupon_api {
        # max_fails=0: 실패해도 인스턴스를 빼지 않는다. 기본값(1)이면 과부하로 연결이 한 번 늦기만 해도 그 인스턴스를
        # 10초간 빼고, 두 대가 다 빠지면 모든 요청이 바로 502가 된다 (no live upstreams). 장애가 아니라 과부하인데
        # 남은 한 대에 부하를 몰아 연쇄로 무너뜨리는 셈이라, 서버 2대 구성에서는 끄고 헬스체크는 Docker에 맡긴다 (docs/06 Phase 5 결과)
        server coupon-api-1:8080 max_fails=0;
        server coupon-api-2:8080 max_fails=0;
        # nginx → API 구간은 연결을 재사용한다 (요청마다 TCP 연결을 새로 맺지 않음)
        keepalive 128;
    }

    server {
        # 동시에 몰리는 새 연결을 받아 둘 대기 큐 (컨테이너의 net.core.somaxconn도 같이 올려야 적용된다)
        listen 80 backlog=16384;

        # 대기열 순번 SSE. 응답을 모으지 않고 바로 흘려보내고, 오래 열려 있어도 끊지 않는다
        # (API가 순번이 그대로여도 5초마다 보내므로 read timeout은 넉넉하게만 두면 된다)
        location ~ ^/api/events/[0-9]+/queue/me/stream$ {
            proxy_pass http://coupon_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 15m;
        }

        location / {
            proxy_pass http://coupon_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            # 한 인스턴스가 실패해도 다른 인스턴스로 재시도하지 않는다.
            # 발급 요청은 멱등이 아니라서 재시도하면 같은 요청이 두 번 처리될 수 있다.
            proxy_next_upstream off;
        }
    }
}

# 앱: nginx, coupon-api ×2, coupon-worker, simulator (실측 모드)
# 인프라 파일과 함께 띄운다. 개발 모드로 띄운 앱(8080, 8090)은 먼저 내려야 포트가 겹치지 않는다.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml up -d --build --wait
# 자원 제한 수치는 docs/02-architecture.md 7장

x-backend-env: &backend-env
  TZ: Asia/Seoul
  DB_HOST: mysql
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092

x-infra-ready: &infra-ready
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

# JRE 이미지에 curl이 없어서 bash의 /dev/tcp로 health 엔드포인트를 확인한다
x-healthcheck: &healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/$${SERVER_PORT:-8080} && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  coupon-api-1:
    build:
      context: ../backend
      args:
        MODULE: coupon-api
    image: fcfs/coupon-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      INSTANCE_ID: coupon-api-1
      ACCEPT_COUNT: 8192
      DB_POOL_SIZE: 10
      # 힙은 제한의 60%. 나머지는 동시 연결 수천 개의 소켓 버퍼, Netty(Lettuce·Redisson) 직접 메모리, 메타스페이스 몫
      JAVA_OPTS: -XX:MaxRAMPercentage=60
    healthcheck: *healthcheck
    # 커널의 연결 대기 큐. 기본값(4096)이 accept-count보다 작으면 그 값으로 잘린다.
    # 1만 명이 몇 초 안에 SSE를 맺으면 큐가 넘쳐 nginx가 연결하지 못하고 504가 난다 (docs/06 Phase 5 결과)
    sysctls:
      net.core.somaxconn: 8192
    depends_on: *infra-ready
    deploy:
      resources:
        limits:
          cpus: "1"
          # 512m에서는 Redisson 추가 후 메모리 한도에 붙어 처리량이 절반 이하로 떨어졌다 (docs/02 7장).
          # 1g(힙 512m)에서는 대기열 SSE 5천 연결을 버티지 못하고 힙 OOM으로 죽었다 (docs/06 Phase 5 결과)
          memory: 1536m

  coupon-api-2:
    image: fcfs/coupon-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      INSTANCE_ID: coupon-api-2
      ACCEPT_COUNT: 8192
      DB_POOL_SIZE: 10
      JAVA_OPTS: -XX:MaxRAMPercentage=60
    healthcheck: *healthcheck
    # 커널의 연결 대기 큐. 기본값(4096)이 accept-count보다 작으면 그 값으로 잘린다.
    # 1만 명이 몇 초 안에 SSE를 맺으면 큐가 넘쳐 nginx가 연결하지 못하고 504가 난다 (docs/06 Phase 5 결과)
    sysctls:
      net.core.somaxconn: 8192
    # 같은 이미지를 쓰므로 1번이 빌드·기동된 뒤에 띄운다 (Flyway 마이그레이션도 1번이 먼저 끝냄)
    depends_on:
      coupon-api-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536m

  coupon-worker:
    build:
      context: ../backend
      args:
        MODULE: coupon-worker
    image: fcfs/coupon-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      SERVER_PORT: 8082
    healthcheck: *healthcheck
    depends_on: *infra-ready
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    ulimits:
      nofile: 65535
    # listen backlog(16384)이 실제로 적용되게 커널 연결 대기 큐도 같이 키운다
    sysctls:
      net.core.somaxconn: 16384
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      coupon-api-1:
        condition: service_healthy
      coupon-api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # 동시 연결마다 버퍼를 잡는다. worker_connections 상한까지 받아도 넘지 않게 둔다
          memory: 256m

  simulator:
    build:
      context: ../backend
      args:
        MODULE: simulator
    image: fcfs/simulator
    restart: unless-stopped
    environment:
      <<: *backend-env
      SERVER_PORT: 8090
      # 가상 사용자 요청은 nginx로 보내고, 서버 지표는 각 인스턴스에서 직접 읽는다
      TARGET_BASE_URL: http://nginx
      SERVER_METRICS_URLS: http://coupon-api-1:8080,http://coupon-api-2:8080
      JAVA_OPTS: -XX:MaxRAMPercentage=60
    ports:
      - "8090:8090"
    healthcheck: *healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          # 부하 생성기가 먼저 한계에 닿으면 측정이 왜곡된다. 재시도 폭주 때 동시 연결 1만 개를 버틸 만큼 둔다
          memory: 1536m
